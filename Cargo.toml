[package]
name = "openworkers-runtime-boa"
version = "0.18.0"
edition = "2024"

[features]
actix = ["dep:actix-web", "openworkers-core/actix"]
conformance = ["dep:openworkers-transform"]
ssr-bench = ["dep:openworkers-transform"]

[dependencies]
# Common types
# openworkers-core = { path = "../openworkers-core" }

# The shared web surface
# openworkers-wintertc = { path = "../openworkers-wintertc" }
openworkers-wintertc = { git = "https://github.com/openworkers/openworkers-wintertc", tag = "v0.1.6" }

# The WHATWG Encoding Standard, so TextDecoder answers for every label
encoding_rs = "0.8"
# The WHATWG URL parser behind the surface's urlParse and urlUpdate ops
url = "2.5"
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.18.0", features = ["hyper"] }

# Boa JavaScript engine (main, no release carries the fixes this runtime needs)
boa_engine = { git = "https://github.com/boa-dev/boa", rev = "93a9e31a83bbaa15bbd8b687e61639ffc53bbef1", package = "boa_engine" }
boa_gc = { git = "https://github.com/boa-dev/boa", rev = "93a9e31a83bbaa15bbd8b687e61639ffc53bbef1", package = "boa_gc" }
boa_runtime = { git = "https://github.com/boa-dev/boa", rev = "93a9e31a83bbaa15bbd8b687e61639ffc53bbef1", package = "boa_runtime", default-features = false, features = ["fetch", "url"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP
bytes = { version = "1.11", features = ["serde"] }
# The request and response types boa_runtime's Fetcher trait speaks
http = "1"

# Crypto
# Pure Rust, so the runtime keeps the memory model boa gives it
getrandom = "0.4"
sha1 = "0.11"
sha2 = "0.11"
uuid = { version = "1.17", features = ["v4"] }

# Optional dependencies for examples/integration
actix-web = { version = "4.12.0", features = ["macros"], optional = true }

# ESM to classic script lowering, only used by the ssr_bench and conformance examples
openworkers-transform = { git = "https://github.com/openworkers/openworkers-transform", tag = "v0.1.0", optional = true }

[dev-dependencies]
env_logger = "0.11"

[[example]]
name = "ssr_bench"
required-features = ["ssr-bench"]

[[example]]
name = "conformance"
required-features = ["conformance"]
