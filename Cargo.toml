[package]
name = "openworkers-runtime-boa"
version = "0.13.0"
edition = "2024"

[features]
actix = ["dep:actix-web", "openworkers-core/actix"]

[dependencies]
# Common types
# openworkers-core = { path = "../openworkers-core" }
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.13.1", features = ["hyper"] }

# Boa JavaScript engine (pinned to main for ICU 2.1 compat with v8)
boa_engine = { git = "https://github.com/boa-dev/boa", rev = "07ebe591c721307f110cc4b082f03d7d62f4a352", package = "boa_engine" }
boa_gc = { git = "https://github.com/boa-dev/boa", rev = "07ebe591c721307f110cc4b082f03d7d62f4a352", package = "boa_gc" }

# Async runtime
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP
bytes = { version = "1.11", features = ["serde"] }
tokio-stream = "0.1"

# Crypto
ring = "0.17"
uuid = { version = "1.17", features = ["v4"] }

# Optional dependencies for examples/integration
actix-web = { version = "4.12.0", features = ["macros"], optional = true }

[dev-dependencies]
serde_json = "1.0"
